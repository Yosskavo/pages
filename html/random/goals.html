<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Goals | Yosskavo</title>
	<link rel="icon" type="image/svg+xml" href="../../icons/favicon.svg">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../projects/projects.html">Projects</a></li>
                <li><a href="random.html" class="active">Random</a></li>
                <li><a href="../contact/contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section id="goals">
        <h2>Next Goals &amp; Roadmap</h2>
        <p>Current roadmap, upcoming 1337 school projects, and technologies I'm diving into:</p>

        <!-- Search, Filter & Sort Controls Bar -->
        <div class="controls-bar">
            <input type="text" id="search-input" placeholder="Search goals by title, description, or tech..." class="search-input">
            
            <select id="filter-select" class="sort-select">
                <option value="all">Filter: All Statuses</option>
                <option value="In Progress">In Progress</option>
                <option value="Planned">Planned</option>
                <option value="Exploring">Exploring</option>
                <option value="Future Research">Future Research</option>
            </select>

            <select id="sort-select" class="sort-select">
                <option value="default">Sort: Default</option>
                <option value="az">Title: A to Z</option>
                <option value="za">Title: Z to A</option>
            </select>
        </div>

        <div id="goals-container">
            <!-- Dynamic content loaded from data/goals.json -->
        </div>

        <p><a href="random.html">&larr; Back to Random</a></p>
    </section>

    <script>
        let allGoals = [];

        function renderGoals() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filterVal = document.getElementById('filter-select').value;
            const sortVal = document.getElementById('sort-select').value;
            const container = document.getElementById('goals-container');

            let filtered = allGoals.filter(g => {
                const title = (g.title || '').toLowerCase();
                const desc = (g.description || '').toLowerCase();
                const tech = (g.tech || '').toLowerCase();
                const domain = (g.domain || '').toLowerCase();
                const matchesQuery = title.includes(query) || desc.includes(query) || tech.includes(query) || domain.includes(query);
                if (!matchesQuery) return false;

                if (filterVal !== 'all') {
                    return g.status === filterVal;
                }
                return true;
            });

            if (sortVal === 'az') {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            } else if (sortVal === 'za') {
                filtered.sort((a, b) => b.title.localeCompare(a.title));
            }

            if (filtered.length === 0) {
                container.innerHTML = '<p>No matching goals found.</p>';
                return;
            }

            container.innerHTML = filtered.map(goal => {
                const statusClass = goal.status.toLowerCase().replace(/\s+/g, '-');
                return `
                    <article class="project-card">
                        <div class="card-header-block">
                            <h3>${goal.title}</h3>
                        </div>
                        <p>${goal.description}</p>
                        <ul>
                            ${goal.tech ? `<li><strong>Tech:</strong> ${goal.tech}</li>` : ''}
                            ${goal.domain ? `<li><strong>Domain:</strong> ${goal.domain}</li>` : ''}
                        </ul>
                        <div class="card-footer-stacked">
                            <div class="goal-status-wrapper">
                                <span class="status-pill status-${statusClass}">${goal.status}</span>
                            </div>
                            ${goal.target_date ? `<span class="target-date">Target Date: <strong>${goal.target_date}</strong></span>` : ''}
                        </div>
                    </article>
                `;
            }).join('');
        }

        fetch('../../data/goals.json')
            .then(res => res.json())
            .then(goals => {
                allGoals = goals;
                renderGoals();
            })
            .catch(err => {
                document.getElementById('goals-container').innerHTML = '<p>No goals added yet. Add entries to <code>data/goals.json</code>!</p>';
            });

        document.getElementById('search-input').addEventListener('input', renderGoals);
        document.getElementById('filter-select').addEventListener('change', renderGoals);
        document.getElementById('sort-select').addEventListener('change', renderGoals);
    </script>
</body>
</html>
