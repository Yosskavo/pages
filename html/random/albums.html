<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Reviews | Yosskavo</title>
	<link rel="icon" type="image/svg+xml" href="../../icons/favicon.svg">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../projects/projects.html">Projects</a></li>
                <li><a href="random.html" class="active">Random</a></li>
                <li><a href="../contact/contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section id="album-reviews">
        <h2>Album Reviews &amp; Highlights</h2>
        <p>Personal reviews, ratings, and sound design highlights of albums I listen to:</p>

        <!-- Search & Sort Controls Bar -->
        <div class="controls-bar">
            <input type="text" id="search-input" placeholder="Search albums by title, artist, genre, or track..." class="search-input">
            <select id="sort-select" class="sort-select">
                <option value="default">Sort: Default</option>
                <option value="rating">Rating: Highest First</option>
                <option value="release_new">Release Date: Newest First</option>
                <option value="release_old">Release Date: Oldest First</option>
                <option value="az">Title: A to Z</option>
                <option value="za">Title: Z to A</option>
            </select>
        </div>

        <div id="albums-container">
            <!-- Dynamic content loaded from data/albums.json -->
        </div>

        <p><a href="random.html">&larr; Back to Random</a></p>
    </section>

    <script>
        let allAlbums = [];

        function renderAlbums() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const sortVal = document.getElementById('sort-select').value;
            const container = document.getElementById('albums-container');

            let filtered = allAlbums.filter(a => {
                const title = (a.title || '').toLowerCase();
                const artist = (a.artist || '').toLowerCase();
                const genre = (a.genre || '').toLowerCase();
                const review = (a.review || '').toLowerCase();
                const tracks = (a.favorite_tracks ? a.favorite_tracks.join(' ') : '').toLowerCase();
                return title.includes(query) || artist.includes(query) || genre.includes(query) || review.includes(query) || tracks.includes(query);
            });

            if (sortVal === 'az') {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            } else if (sortVal === 'za') {
                filtered.sort((a, b) => b.title.localeCompare(a.title));
            } else if (sortVal === 'rating') {
                filtered.sort((a, b) => {
                    const parseRating = r => parseFloat((r.rating || '').replace('/10', '')) || 0;
                    return parseRating(b) - parseRating(a);
                });
            } else if (sortVal === 'release_new') {
                filtered.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            } else if (sortVal === 'release_old') {
                filtered.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
            }

            if (filtered.length === 0) {
                container.innerHTML = '<p>No matching album reviews found.</p>';
                return;
            }

            container.innerHTML = filtered.map(album => `
                <article class="album-card">
                    ${album.cover ? `<img src="${album.cover}" alt="${album.title} cover" class="album-cover" loading="lazy" referrerpolicy="no-referrer">` : ''}
                    <div class="album-details">
                        <div class="card-header-block">
                            <h3>${album.title}</h3>
                            ${album.date ? `<div class="date-badge">Released: ${album.date}</div>` : ''}
                        </div>
                        <p style="text-align: center;"><strong>Artist:</strong> ${album.artist} • <strong>Genre:</strong> ${album.genre}</p>
                        <p>${album.review}</p>
                        <ul class="card-details-list">
                            <li><strong>Rating:</strong> <span class="rating-badge">${album.rating}</span></li>
                            ${album.favorite_tracks ? `<li><strong>Favorite Tracks:</strong> ${album.favorite_tracks.join(', ')}</li>` : ''}
                        </ul>
                    </div>
                </article>
            `).join('');
        }

        fetch('../../data/albums.json')
            .then(res => res.json())
            .then(albums => {
                allAlbums = albums;
                renderAlbums();
            })
            .catch(err => {
                document.getElementById('albums-container').innerHTML = '<p>No reviews added yet. Add entries to <code>data/albums.json</code>!</p>';
            });

        document.getElementById('search-input').addEventListener('input', renderAlbums);
        document.getElementById('sort-select').addEventListener('change', renderAlbums);
    </script>
</body>
</html>
