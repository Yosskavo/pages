<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic Notes | Yosskavo</title>
	<link rel="icon" type="image/svg+xml" href="../../icons/favicon.svg">
    <link rel="stylesheet" href="../../css/style.css">
    <!-- Marked JS Parser for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../projects/projects.html">Projects</a></li>
                <li><a href="random.html" class="active">Random</a></li>
                <li><a href="../contact/contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section id="readme-viewer">
        <div class="viewer-controls">
            <!-- Topic File Selector in Top Left -->
            <div class="file-selector-wrapper">
                <label for="file-select" class="file-label">Topic Note:</label>
                <select id="file-select" class="file-select"></select>
            </div>

            <a href="topics.html" class="see-all-link">&larr; Back to Topics</a>
        </div>

        <div class="section-header">
            <h2 id="topic-title">Topic Notes</h2>
        </div>

        <article class="readme-card" id="readme-content">
            <p>Loading topic notes...</p>
        </article>

        <p><a href="topics.html">&larr; Back to Topics</a></p>
    </section>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentTopicId = urlParams.get('topic') || 'unix-processes-signals';
        let allTopics = [];

        const fileSelect = document.getElementById('file-select');
        const readmeContent = document.getElementById('readme-content');
        const topicTitle = document.getElementById('topic-title');

        fetch('../../data/topics.json')
            .then(res => res.json())
            .then(topics => {
                allTopics = topics;
                fileSelect.innerHTML = topics.map(t => `
                    <option value="${t.id}" ${t.id === currentTopicId ? 'selected' : ''}>${t.title}</option>
                `).join('');

                const active = allTopics.find(t => t.id === currentTopicId) || allTopics[0];
                if (active) {
                    fileSelect.value = active.id;
                    loadMarkdown(active);
                }
            })
            .catch(err => {
                readmeContent.innerHTML = '<p>Could not load topic index.</p>';
            });

        function loadMarkdown(topicObj) {
            if (!topicObj || !topicObj.markdown_file) {
                readmeContent.innerHTML = '<p>Topic documentation file not found.</p>';
                return;
            }

            topicTitle.textContent = topicObj.title;
            document.title = `${topicObj.title} | Notes | Yosskavo`;

            // Update URL without page reload
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('topic', topicObj.id);
            window.history.replaceState({}, '', newUrl);

            fetch(topicObj.markdown_file)
                .then(res => {
                    if (!res.ok) throw new Error('File not found');
                    return res.text();
                })
                .then(mdText => {
                    if (window.marked) {
                        readmeContent.innerHTML = window.marked.parse(mdText);
                    } else {
                        readmeContent.innerHTML = '<pre>' + mdText + '</pre>';
                    }
                    attachLinkInterceptors();
                })
                .catch(err => {
                    readmeContent.innerHTML = `<p>Topic note file is not available.</p>`;
                });
        }

        function attachLinkInterceptors() {
            const links = readmeContent.querySelectorAll('a');
            links.forEach(a => {
                const href = a.getAttribute('href');
                if (href && (href.startsWith('http://') || href.startsWith('https://'))) {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener');
                }
            });
        }

        fileSelect.addEventListener('change', (e) => {
            currentTopicId = e.target.value;
            const selected = allTopics.find(t => t.id === currentTopicId);
            if (selected) {
                loadMarkdown(selected);
            }
        });
    </script>
</body>
</html>
