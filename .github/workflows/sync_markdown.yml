name: Sync Project Documentation

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
      - master
      - Yami

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Markdown Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_markdown.py

      - name: Commit and Push Updated Markdown Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated sync: Update project markdown documentation"
